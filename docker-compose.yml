# nginx → N game nodes (each owns its rooms) + Redis room directory.
# Scale: add node3… with a unique NODE_ID / ROOM_NUMBER_BASE / PUBLIC_WS_URL and an nginx location.
# To also serve the built frontend from the nodes, mount it and set STATIC_DIR.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  node1: &node
    build: .
    environment:
      NODE_ID: n1
      ROOM_NUMBER_BASE: 0
      PUBLIC_WS_URL: /n1/ws
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "1"
      MAX_CONN_PER_IP: 20
    depends_on: [redis]
    stop_grace_period: 10s

  node2:
    <<: *node
    environment:
      NODE_ID: n2
      ROOM_NUMBER_BASE: 100
      PUBLIC_WS_URL: /n2/ws
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "1"
      MAX_CONN_PER_IP: 20

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [node1, node2]
