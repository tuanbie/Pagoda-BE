# Access log without client IPs or query strings (websocket URLs carry the resume token).
log_format noip '$time_iso8601 "$request_method $uri" $status $body_bytes_sent $request_time';

upstream web { least_conn; server node1:8787; server node2:8787; keepalive 32; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_tokens off;
  access_log /var/log/nginx/access.log noip;
  client_max_body_size 64k;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Each node advertises its own websocket path in /api/rooms; clients connect straight to it.
  location /n1/ws { proxy_pass http://node1:8787; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 1h; }
  location /n2/ws { proxy_pass http://node2:8787; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 1h; }

  location / {
    proxy_pass http://web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
